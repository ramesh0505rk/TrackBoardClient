<div class="onboard-container">
    <div class="content-header">
        <h1>Welcome to <span class="logo">Track Board</span></h1>
        <p>Please create an organization or join an existing one.</p>
    </div>
    <div class="content-body">
        <div class="create-org" (click)="onRegister()">
            <h3>Create an organization</h3>
            <p>You can register your own organization here</p>
        </div>
        <div class="join-org">
            <h3>Join an organization</h3>
            <p>You can join an existing organization here</p>
        </div>
    </div>
</div>
