<div class="signup-container">
    <div class="signup-card">
        <div class="content-header">
            <h1 class="logo">Track Board</h1>
            <p>Create your account to get started</p>
        </div>
        <div class="content-body">
            <form class="form-content" [formGroup]="signUpForm" (ngSubmit)="onSubmit()">
                <div class="form-floating">
                    <input type="email" formControlName="email" class="form-control" id="floatingEmail"
                        placeholder="Email">
                    <label for="floatingEmail">Email</label>
                    <small *ngIf="signUpForm.get('email')?.invalid && signUpForm.get('email')?.touched"
                        class="pt-2 small" style="color: #ff0000c4;display: block;">
                        Please enter a valid email address.
                    </small>
                    <small class="description">This email will be your Track Board account</small>
                </div>
                <div class="form-floating">
                    <input type="password" formControlName="password" class="form-control" id="floatingPassword"
                        placeholder="Password">
                    <label for="floatingPassword">Password</label>
                    <small class="description">Your password must have 8 or more characters, upper and lowercase letters
                        and at least one number.</small>
                </div>
                <div class="form-floating">
                    <input type="text" formControlName="userName" class="form-control" id="floatingInput"
                        placeholder="Username">
                    <label for="floatingInput">Username</label>
                </div>
                <div class="form-floating">
                    <input type="text" formControlName="firstName" class="form-control" id="floatingFirstName"
                        placeholder="First Name">
                    <label for="floatingFirstName">First Name</label>
                </div>
                <div class="form-floating">
                    <input type="text" formControlName="lastName" class="form-control" id="floatingLastName"
                        placeholder="Last Name">
                    <label for="floatingLastName">Last Name</label>
                </div>
                <button class="submit-btn" type="submit">
                    Sign Up
                </button>
            </form>
        </div>
        <div class="content-footer">
            <p>Already have an account?</p>
            <button (click)="onSignInClick()"><a>Sign in here</a></button>
        </div>
    </div>
</div>
